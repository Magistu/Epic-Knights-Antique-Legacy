dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"

    modCompileOnlyApi "maven.modrinth:epic-knights-shields-armor-and-weapons:${rootProject.epic_knights_version}"

    // Auto Config v1 (provided by Cloth Config). Use compileOnly so common compiles against the API
    // and each platform supplies the correct runtime (fabric/neoforge) variant.
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
}

architectury {
    common(rootProject.enabled_platforms.split(","))
}
