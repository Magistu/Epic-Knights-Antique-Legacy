architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/antiquelegacy.accesswidener")
}

repositories {
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
    modApi "me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}"
    modCompileOnlyApi "maven.modrinth:epic-knights-shields-armor-and-weapons:${rootProject.epic_knights_version}"
}

java {
    withSourcesJar()
}
