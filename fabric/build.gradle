import groovy.json.JsonOutput

plugins {
    id "com.github.johnrengelman.shadow" version "7.0.0"
    id "com.hypherionmc.modutils.modpublisher" version "2.1.8"
}

base {
    archivesName = "Fabric-1.21.1-Epic-Knights-Antique-Legacy"
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    modImplementation "maven.modrinth:epic-knights-shields-armor-and-weapons:${rootProject.epic_knights_version}-fabric"

    // Cloth Config provides Auto Config v1 used by common config classes
    modApi "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    def rawAuthors      = (project.findProperty("mod_authors") ?: "").toString()
    def rawContributors = (project.findProperty("mod_contributors") ?: "").toString()

    def authorsList      = rawAuthors.split(",")*.trim().findAll { it }
    def contributorsList = rawContributors.split(",")*.trim().findAll { it }

    def authorsArray      = JsonOutput.toJson(authorsList)
    def contributorsArray = JsonOutput.toJson(contributorsList)

    def expandProps = [
            "mod_id"                    : (project.findProperty("mod_id") ?: "").toString(),
            "mod_name"                  : (project.findProperty("mod_display_name") ?: "").toString(),
            "mod_version"               : (project.findProperty("mod_version") ?: "").toString(),
            "mod_description"           : (project.findProperty("mod_description") ?: "").toString(),
            "mod_authors"               : authorsArray,
            "mod_contributors"          : contributorsArray,
            "mod_license"               : (project.findProperty("mod_license") ?: "").toString(),
            "mod_discord_url"           : (project.findProperty("mod_discord_url") ?: "").toString(),
            "mod_git_url"               : (project.findProperty("mod_git_url") ?: "").toString(),
            "mod_issues_url"            : (project.findProperty("mod_issues_url") ?: "").toString(),
            "mod_page_url"              : (project.findProperty("mod_page_url") ?: "").toString(),
            "minecraft_min_version"     : (project.findProperty("minecraft_min_version") ?: "").toString(),
            "minecraft_max_version"     : (project.findProperty("minecraft_max_version") ?: "").toString(),
            "fabric_loader_version"     : (project.findProperty("fabric_loader_version") ?: "").toString(),
            "min_fabric_loader_version" : (project.findProperty("min_fabric_loader_version") ?: "").toString(),
            "architectury_api_version"  : (project.findProperty("architectury_api_version") ?: "").toString(),
            "cloth_config_version"      : (project.findProperty("cloth_config_version") ?: "").toString(),
            "epic_knights_version"      : (project.findProperty("epic_knights_version") ?: "").toString(),
    ]

    inputs.properties(expandProps)

    filesMatching('fabric.mod.json') {
        expand(expandProps)
    }

    // Normalize recipe JSONs to Minecraft 1.21.1 schema
    // 1) Convert result strings to objects and rename "item" to "id" within result objects
    // 2) Migrate material-first c: tags to category-first c: tags (e.g., c:bronze_ingots -> c:ingots/bronze)
    doLast {
        def fixText = { String s ->
            def t = s.replaceAll(/"result"\s*:\s*"([^"]+)"/, '"result": { "id": "$1" }')

            // Normalize tag paths from material-first to category-first for cross-loader compatibility
            // c:bronze_ingots -> c:ingots/bronze, etc.
            t = t.replaceAll(/"tag"\s*:\s*"c:(bronze|iron|gold|copper|tin)_ingots"/, '"tag": "c:ingots/$1"')
            t = t.replaceAll(/"tag"\s*:\s*"c:(bronze|iron|gold|copper|tin)_nuggets"/, '"tag": "c:nuggets/$1"')
            t = t.replaceAll(/"tag"\s*:\s*"c:(bronze|iron|gold|copper|tin)_plates"/,  '"tag": "c:plates/$1"')
            t = t.replaceAll(/("result"\s*:\s*\{[^}]*?)"item"/, '$1"id"')

            // Tag path normalization map: material-first -> category-first
            Map<String, String> tagMap = [
                    '"tag": "c:bronze_ingots"' : '"tag": "c:ingots/bronze"',
                    '"tag": "c:bronze_nuggets"': '"tag": "c:nuggets/bronze"',
                    '"tag": "c:bronze_plates"' : '"tag": "c:plates/bronze"',

                    '"tag": "c:iron_ingots"'  : '"tag": "c:ingots/iron"',
                    '"tag": "c:iron_nuggets"' : '"tag": "c:nuggets/iron"',
                    '"tag": "c:iron_plates"'  : '"tag": "c:plates/iron"',

                    '"tag": "c:gold_ingots"'  : '"tag": "c:ingots/gold"',
                    '"tag": "c:gold_nuggets"' : '"tag": "c:nuggets/gold"',

                    '"tag": "c:copper_ingots"': '"tag": "c:ingots/copper"',
                    '"tag": "c:copper_nuggets"': '"tag": "c:nuggets/copper"',

                    '"tag": "c:tin_ingots"'   : '"tag": "c:ingots/tin"',
                    '"tag": "c:tin_nuggets"'  : '"tag": "c:nuggets/tin"'
            ]
            tagMap.each { k, v -> t = t.replace(k, v) }
            return t
        }
        outputs.files.each { out ->
            fileTree(out).matching { include '**/recipes/**/*.json' }.each { File f ->
                try {
                    def orig = f.getText('UTF-8')
                    def mod = fixText(orig)
                    if (mod != orig) {
                        f.write(mod, 'UTF-8')
                    }
                } catch (Exception e) {
                    logger.warn("Failed to normalize recipe JSON: ${f}", e)
                }
            }
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar

    archiveClassifier.set(null)
}

def display_minecraft_version = rootProject.findProperty("display_minecraft_version")
def mod_version = rootProject.findProperty("mod_version")

tasks.named("remapJar") { t ->
    t.archiveFileName.set("epic-knights-antique-legacy-${display_minecraft_version}-fabric-${mod_version}.jar")
}

publisher {
    def mcVersionsFabric = (rootProject.ext.minecraftGameVersions as List).collect { it.toString() } as String[]
    def changelogFile = rootProject.file("fabric/CHANGELOG.md")
    def changelogText = changelogFile.exists() ? changelogFile.getText("UTF-8") : ""

    apiKeys {
        modrinth System.getenv("MODRINTH_TOKEN")
        curseforge System.getenv("CURSEFORGE_TOKEN")
    }

    setCurseID((rootProject.findProperty("mod_curseforge_id") ?: "").toString())

    setModrinthID((rootProject.findProperty("mod_modrinth_id") ?: "").toString())

    setVersionType((rootProject.findProperty("release_channel") ?: "release").toString())

    setChangelog(changelogText)

    setProjectVersion(rootProject.mod_version)

    setDisplayName("[${rootProject.minecraft_min_version}-fabric] ${rootProject.mod_display_name} ${rootProject.mod_version}")

    setGameVersions(*mcVersionsFabric)

    setLoaders("fabric")

    setCurseEnvironment("both")

    setArtifact(tasks.remapJar)

    modrinthDepends {
        required("epic-knights-shields-armor-and-weapons")
    }

    curseDepends {
        required("epic-knights-armor-and-weapons")
    }
}
